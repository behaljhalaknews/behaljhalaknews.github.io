        const shareData = { title: data.title, text: data.title, url: window.location.href };
        try {
            if (navigator.share) {
                await navigator.share(shareData);
            } else if (navigator.clipboard) {
                await navigator.clipboard.writeText(window.location.href);
                shareButton.textContent = "✓ लिंक कॉपी हो गया";
            } else {
                window.prompt("इस लिंक को कॉपी करें:", window.location.href);
            }
        } catch (error) {
            if (error.name !== "AbortError") {
                shareButton.textContent = "शेयर नहीं हो सका";
            }
        }
