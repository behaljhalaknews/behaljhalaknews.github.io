name: Remove News Package

on:
  workflow_dispatch:
    inputs:
      id:
        description: "जिस खबर की ID हटानी है (News Manager से कॉपी करें)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove news from index
        env:
          NEWS_ID: ${{ inputs.id }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const newsId = String(process.env.NEWS_ID || "").trim();
          if (!/^[a-z0-9-]+$/.test(newsId)) {
            throw new Error("Invalid article ID");
          }

          const page = newsId + ".html";
          const raw = fs.readFileSync("news-data.js", "utf8");

          // Safely evaluate only the local news-data.js assignment.
          // No network access or external code is involved.
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(raw, sandbox, { timeout: 2000 });

          const data = sandbox.window.BAHAL_JHALAK_NEWS;
          if (!Array.isArray(data)) {
            throw new Error("news-data.js does not contain a news array");
          }

          const matches = data.filter(x => x && String(x.id || "") === newsId);
          if (matches.length !== 1) {
            throw new Error("Expected exactly one matching news item; found " + matches.length);
          }

          const filtered = data.filter(x => !x || String(x.id || "") !== newsId);

          // Keep the file valid JavaScript and preserve the site's expected variable name.
          fs.writeFileSync(
            "news-data.js",
            "/* बहल झलक — News Data */\\n" +
            "window.BAHAL_JHALAK_NEWS = " +
            JSON.stringify(filtered, null, 2) +
            ";\\n",
            "utf8"
          );

          if (fs.existsSync(page)) {
            fs.writeFileSync(
              page,
              "<!doctype html><html lang='hi'><head><meta charset='utf-8'><meta name='robots' content='noindex'><title>खबर उपलब्ध नहीं है</title></head><body><h1>यह खबर अब उपलब्ध नहीं है।</h1></body></html>\\n",
              "utf8"
            );
          }

          console.log("Removed from site index:", newsId);
          NODE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "Remove published news"
          git push
