name: Publish Direct Advertisement Package

on:
  workflow_dispatch:
    inputs:
      ads_json:
        description: "Direct Advertisement JSON package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and write ads-data.js
        env:
          ADS_JSON: ${{ inputs.ads_json }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const raw = process.env.ADS_JSON || '';
          let data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            console.error('Invalid ads JSON:', e.message);
            process.exit(1);
          }
          if (!Array.isArray(data)) {
            console.error('ads_json must be an array');
            process.exit(1);
          }
          fs.writeFileSync(
            'ads-data.js',
            '/* बहल झलक — Direct Advertisement data */\nwindow.BAHAL_DIRECT_ADS = ' +
            JSON.stringify(data, null, 2) +
            ';\n',
            'utf8'
          );
          console.log('Validated', data.length, 'advertisements.');
          NODE

      - name: Commit changes
        run: |
          git config user.name "bahal-jhalak-ads-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ads-data.js
          if git diff --cached --quiet; then
            echo "No advertisement changes to publish."
            exit 0
          fi
          git commit -m "Update direct advertisement package"
          git push
