name: Publish News Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "News Manager ka Publish Package JSON"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish package
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import html
          from datetime import date

          obj = json.loads(os.environ["PACKAGE"])

          required = ["id", "title", "category", "location", "date", "page", "excerpt", "content"]
          missing = [k for k in required if k not in obj]
          if missing:
              raise SystemExit("Missing fields: " + ", ".join(missing))

          news_id = str(obj["id"])
          if not re.fullmatch(r"[a-z0-9-]+", news_id):
              raise SystemExit("Article ID must contain only a-z, 0-9 and hyphens")

          if os.path.exists(news_id + ".html"):
              raise SystemExit("Article page already exists")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write("NEWS_ID=" + news_id + "\n")

          data_path = "news-data.js"
          data = open(data_path, encoding="utf-8").read()

          if news_id in data:
              raise SystemExit("Article ID already exists")

          entry = {
              "id": obj["id"],
              "title": obj["title"],
              "category": obj["category"],
              "location": obj["location"],
              "date": obj["date"],
              "image": obj.get("image", ""),
              "videoUrl": obj.get("videoUrl", ""),
              "page": obj["page"],
              "featured": bool(obj.get("featured", False)),
              "breaking": bool(obj.get("breaking", False)),
              "excerpt": obj["excerpt"],
              "content": obj["content"]
          }

          if entry["featured"]:
              data = re.sub(r"\n\s*featured:\s*true,?", "", data)

          pos = data.rfind("];")
          if pos < 0:
              raise SystemExit("news-data.js array ending not found")

          entry_text = json.dumps(entry, ensure_ascii=False, indent=2)
          entry_text = entry_text.replace("\n", "\n  ")
          data = data[:pos] + "  " + entry_text + ",\n" + data[pos:]
          open(data_path, "w", encoding="utf-8").write(data)

          title = html.escape(str(obj["title"]), quote=True)
          desc = html.escape(str(obj["excerpt"]), quote=True)
          category = html.escape(str(obj["category"]), quote=True)
          location = html.escape(str(obj["location"]), quote=True)
          news_date = html.escape(str(obj["date"]), quote=True)

          site = "https://behaljhalaknews.github.io"
          page_url = site + "/" + news_id + ".html"
          raw_images = obj.get("images", [])
          if not raw_images and obj.get("image"):
              raw_images = [obj.get("image")]
          images = []
          for image_item in raw_images:
              image_item = str(image_item)
              images.append((image_item if image_item.startswith("http") else site + "/" + image_item.lstrip("./")) if image_item else "")
          images = [x for x in images if x]
          image_url = images[0] if images else ""

          def youtube_embed_url(value):
              value = str(value or "").strip()
              if not value:
                  return ""
              m = re.search(r"(?:youtu\.be/|youtube\.com/(?:watch\?v=|shorts/|embed/))([A-Za-z0-9_-]{6,})", value)
              return "https://www.youtube.com/embed/" + m.group(1) if m else ""

          video_url = youtube_embed_url(obj.get("videoUrl", ""))

          paragraphs = []
          for p in obj["content"]:
              paragraphs.append("<p>" + html.escape(str(p)) + "</p>")
          body = "\n".join(paragraphs)
          video_block = ('<div class="article-video"><div class="article-video-title">▶️ वीडियो</div><div class="article-video-frame"><iframe src="' + html.escape(video_url, quote=True) + '" title="बहल झलक वीडियो" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div></div>') if video_url else ""

          schema = {
              "@context": "https://schema.org",
              "@type": "NewsArticle",
              "headline": obj["title"],
              "description": obj["excerpt"],
              "datePublished": str(obj["date"]),
              "dateModified": str(obj["date"]),
              "mainEntityOfPage": {"@type": "WebPage", "@id": page_url},
              "image": images,
              "author": {"@type": "Organization", "name": "बहल झलक"},
              "publisher": {"@type": "Organization", "name": "बहल झलक"},
              "articleSection": obj["category"]
          }
          if video_url:
              schema["video"] = {"@type":"VideoObject","name":obj["title"],"embedUrl":video_url,"contentUrl":str(obj.get("videoUrl",""))}

          article = "\n".join([
              '<!DOCTYPE html>',
              '<html lang="hi">',
              '<head>',
              '<meta charset="UTF-8">',
              '<meta name="viewport" content="width=device-width, initial-scale=1.0">',
              '<title>' + title + ' | बहल झलक</title>',
              '<meta name="description" content="' + desc + '">',
              '<meta property="og:type" content="article">',
              '<meta property="og:site_name" content="बहल झलक">',
              '<meta property="og:title" content="' + title + ' | बहल झलक">',
              '<meta property="og:description" content="' + desc + '">',
              '<meta property="og:image" content="' + html.escape(image_url, quote=True) + '">',
              '<meta property="og:url" content="' + page_url + '">',
              '<meta name="twitter:card" content="summary_large_image">',
              '<meta name="twitter:title" content="' + title + ' | बहल झलक">',
              '<meta name="twitter:description" content="' + desc + '">',
              '<meta name="twitter:image" content="' + html.escape(image_url, quote=True) + '">',
              '<link rel="canonical" href="' + page_url + '">',
              '<script type="application/ld+json">' + json.dumps(schema, ensure_ascii=False) + '</script>',
              '<link rel="stylesheet" href="./style.css">',
              '</head>',
              '<body>',
              '<header class="site-header"><div class="header-container"><div class="site-branding"><a href="./index.html" class="logo-box"><span class="logo-red">बहल</span><span class="logo-yellow">झलक</span><span class="logo-tagline">खबर आपकी, नज़र हमारी</span></a></div></div></header>',
              '<main class="article-page container"><article class="article-card">',
              '<div class="article-header"><span class="category-tag">' + category + '</span><h1>' + title + '</h1><div class="article-meta"><span>' + location + '</span><span>•</span><span>' + news_date + '</span></div></div>',
              ('<div class="article-gallery">' + ''.join('<img class="article-image" src="' + html.escape(u, quote=True) + '" alt="' + title + '"> ' for u in images) + '</div>') if images else '',
              '<div class="article-body">' + body + '</div>' + video_block,
              '''<div class="article-actions"><a href="./index.html" class="back-home-button">← वापस मुख्य पृष्ठ</a></div>
              <div class="social-share-panel"><div class="social-share-title">खबर शेयर करें</div><div class="social-share-buttons">
              <a class="social-share-btn whatsapp-share" id="whatsappShare" href="#" target="_blank" rel="noopener">WhatsApp</a>
              <a class="social-share-btn facebook-share" id="facebookShare" href="#" target="_blank" rel="noopener">Facebook</a>
              <a class="social-share-btn telegram-share" id="telegramShare" href="#" target="_blank" rel="noopener">Telegram</a>
              <button type="button" class="social-share-btn copy-share" id="copyShare">🔗 लिंक कॉपी करें</button>
              <button type="button" class="social-share-btn native-share" id="nativeShare" hidden>📤 शेयर करें</button>
              </div><div class="instagram-note">Instagram पर शेयर करने के लिए लिंक कॉपी करके Instagram में पोस्ट/स्टोरी में पेस्ट करें।</div></div>
              <script>
              (function(){
                const url=window.location.href;
                const title=document.querySelector(".article-header h1")?.textContent||document.title;
                const text=title+" — बहल झलक\\n"+url;
                document.getElementById("whatsappShare").href="https://wa.me/?text="+encodeURIComponent(text);
                document.getElementById("facebookShare").href="https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url);
                document.getElementById("telegramShare").href="https://t.me/share/url?url="+encodeURIComponent(url)+"&text="+encodeURIComponent(title);
                const copyBtn=document.getElementById("copyShare");
                copyBtn.addEventListener("click",async function(){
                  try{await navigator.clipboard.writeText(url);copyBtn.textContent="✓ लिंक कॉपी हो गया";}
                  catch(e){copyBtn.textContent="लिंक कॉपी नहीं हो सका";}
                  setTimeout(()=>copyBtn.textContent="🔗 लिंक कॉपी करें",2200);
                });
                const nativeBtn=document.getElementById("nativeShare");
                if(navigator.share){nativeBtn.hidden=false;nativeBtn.addEventListener("click",()=>navigator.share({title:title,text:"बहल झलक",url:url}));}
              })();
              </script>''',
              '</article></main>',
              '<footer class="site-footer"><div class="footer-container"><p>© 2026 बहल झलक — खबर आपकी, नज़र हमारी</p></div></footer>',
              '</body>',
              '</html>'
          ])

          open(news_id + ".html", "w", encoding="utf-8").write(article)
          PY

      - name: Update sitemap
        env:
          PACKAGE: ${{ inputs.package }}
        run: |
          python3 <<'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          obj = json.loads(os.environ["PACKAGE"])
          site = "https://behaljhalaknews.github.io"
          news_id = str(obj["id"])
          page_url = site + "/" + news_id + ".html"

          sitemap_path = "sitemap.xml"
          ET.register_namespace("", "http://www.sitemaps.org/schemas/sitemap/0.9")
          ET.register_namespace("image", "http://www.google.com/schemas/sitemap-image/1.1")
          tree = ET.parse(sitemap_path)
          root = tree.getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          image_ns = "http://www.google.com/schemas/sitemap-image/1.1"

          existing = {loc.text for loc in root.findall("sm:url/sm:loc", ns) if loc.text}
          if page_url not in existing:
              url_node = ET.SubElement(root, "{http://www.sitemaps.org/schemas/sitemap/0.9}url")
              ET.SubElement(url_node, "{http://www.sitemaps.org/schemas/sitemap/0.9}loc").text = page_url

              raw_images = obj.get("images", [])
              if not raw_images and obj.get("image"):
                  raw_images = [obj.get("image")]
              for image_item in raw_images:
                  image_item = str(image_item or "")
                  if not image_item:
                      continue
                  image_url = image_item if image_item.startswith("http") else site + "/" + image_item.lstrip("./")
                  image_node = ET.SubElement(url_node, "{" + image_ns + "}image")
                  ET.SubElement(image_node, "{" + image_ns + "}loc").text = image_url
                  ET.SubElement(image_node, "{" + image_ns + "}title").text = str(obj.get("title", ""))

              tree.write(sitemap_path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news-data.js "$NEWS_ID.html" sitemap.xml
          git diff --cached --quiet || git commit -m "Publish news from News Editor"
          git push
