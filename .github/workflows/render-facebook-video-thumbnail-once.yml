name: Render Facebook Video Thumbnail Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/render-facebook-video-thumbnail-once.yml"

permissions:
  contents: write

jobs:
  render-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Hindi fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core python3-pil

      - name: Create PNG and update share metadata
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          W, H = 1200, 630
          BG, MAR, RED, WHITE, GOLD, RED2 = (16,24,39), (39,12,24), (205,25,35), (255,255,255), (255,213,74), (224,53,61)
          im = Image.new("RGB", (W,H), BG)
          d = ImageDraw.Draw(im)
          base = "/usr/share/fonts/truetype/noto/"
          reg = ImageFont.truetype(base+"NotoSansDevanagariUI-Regular.ttf", 25)
          bold = ImageFont.truetype(base+"NotoSansDevanagari-Bold.ttf", 47)
          brand = ImageFont.truetype(base+"NotoSansDevanagari-Bold.ttf", 34)
          cat = ImageFont.truetype(base+"NotoSansDevanagari-Bold.ttf", 24)
          sub = ImageFont.truetype(base+"NotoSansDevanagari-Bold.ttf", 32)
          eng = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 21)
          eng_sm = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 18)

          d.rectangle((0,0,W,18), fill=RED)
          d.rectangle((850,95,1200,500), fill=MAR)
          d.ellipse((878,170,1122,414), outline=RED, width=18)
          d.ellipse((908,200,1092,384), fill=RED2)
          d.polygon([(965,245),(965,339),(1041,292)], fill=WHITE)

          d.rounded_rectangle((58,52,418,118), radius=12, fill=WHITE)
          d.text((80,62), "बहल झलक", font=brand, fill=RED, language="hi")
          d.rounded_rectangle((438,66,566,106), radius=20, fill=RED)
          d.ellipse((452,78,466,92), fill=WHITE)
          d.text((475,74), "VIDEO", font=eng, fill=WHITE)

          d.rounded_rectangle((58,158,252,202), radius=7, fill=RED)
          d.text((76,163), "हरियाणा | रोहतक", font=cat, fill=WHITE, language="hi")
          d.text((58,236), "ग्रामीणों ने पुलिसकर्मियों", font=bold, fill=WHITE, language="hi")
          d.text((58,300), "को ही बनाया ‘बंधक’", font=bold, fill=WHITE, language="hi")
          d.rounded_rectangle((58,378,700,384), radius=3, fill=RED)
          d.text((58,415), "वीडियो सोशल मीडिया पर वायरल", font=sub, fill=GOLD, language="hi")
          d.line((58,532,1142,532), fill=(95,48,58), width=2)
          d.text((58,549), "पूरी खबर और वीडियो देखने के लिए लिंक खोलें", font=reg, fill=WHITE, language="hi")
          d.text((1142,557), "BAHAL JHALAK", font=eng_sm, fill=GOLD, anchor="ra")

          palette = [BG, MAR, RED, WHITE, GOLD, RED2] + [(0,0,0)]*250
          palette_data = [channel for color in palette for channel in color]
          palette_image = Image.new("P", (1,1))
          palette_image.putpalette(palette_data)
          png = im.quantize(palette=palette_image, dither=Image.Dither.NONE)
          Path("images").mkdir(exist_ok=True)
          png.save("images/news-1791638988919-thumbnail.png", optimize=True)

          article = Path("news-1791638988919.html")
          html = article.read_text(encoding="utf-8")
          old = "https://behaljhalaknews.github.io/images/news-1791638988919-thumbnail.svg"
          new = "https://behaljhalaknews.github.io/images/news-1791638988919-thumbnail.png"
          if old not in html:
              raise SystemExit("Expected SVG thumbnail URL was not found; refusing to alter the article.")
          html = html.replace(old, new).replace('content="image/svg+xml"', 'content="image/png"')
          article.write_text(html, encoding="utf-8")
          PY

      - name: Commit the thumbnail update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/news-1791638988919-thumbnail.png news-1791638988919.html
          git commit -m "Render Facebook video thumbnail as PNG"
          git push
