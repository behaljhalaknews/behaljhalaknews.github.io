<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>बहल झलक — फोटो मैनेजर</title>
<script src="./supabase-config.js?v=20260929-01"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./news-data.js?v=20260929-01"></script>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:0 auto;padding:20px;background:#f4f6f8;color:#172033}
.card{background:#fff;padding:18px;border-radius:12px;margin:14px 0;box-shadow:0 2px 10px #0001}
input,select,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd3dc;border-radius:8px;box-sizing:border-box}
button{background:#0b2545;color:#fff;font-weight:700;border:0}
button.secondary{background:#667085}
img{max-width:100%;max-height:240px;object-fit:contain;border-radius:8px;background:#eee}
#app{display:none}.status{padding:10px;border-radius:8px;background:#eef2f7;white-space:pre-wrap}
</style>
</head>
<body>
<h1>बहल झलक — फोटो मैनेजर</h1>
<div id="login" class="card">
<h2>Admin Login</h2>
<p>यह पेज केवल अधिकृत Admin के लिए है।</p>
<input id="email" type="email" autocomplete="username" placeholder="Admin Email">
<input id="password" type="password" autocomplete="current-password" placeholder="Password">
<button id="loginBtn" type="button">Login</button>
<div id="loginStatus" class="status"></div>
</div>
<div id="app">
<div class="card"><button id="logoutBtn" type="button" class="secondary">Logout</button></div>
<div class="card"><h2>खबर चुनें</h2><select id="articleSelect"></select><div id="current"></div></div>
<div class="card"><h2>नई फोटो</h2><input id="fileInput" type="file" accept="image/*"><button id="uploadBtn" type="button">फोटो Upload करें</button><div id="status" class="status"></div></div>
</div>
<script>
const sb=window.supabase.createClient(window.BAHAL_SUPABASE_URL,window.BAHAL_SUPABASE_PUBLISHABLE_KEY);
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const loginStatus=document.getElementById("loginStatus");
const loginBox=document.getElementById("login");
const app=document.getElementById("app");
const select=document.getElementById("articleSelect");
const current=document.getElementById("current");
const statusBox=document.getElementById("status");
const fileInput=document.getElementById("fileInput");
const news=Array.isArray(window.BAHAL_JHALAK_NEWS)?window.BAHAL_JHALAK_NEWS:[];

async function refreshSession(){
  try{
    const r=await sb.auth.getSession();
    if(r.data && r.data.session){loginBox.style.display="none";app.style.display="block";initArticles();}
    else{loginBox.style.display="block";app.style.display="none";}
  }catch(e){loginStatus.textContent="Supabase connection error: "+(e.message||e);}
}
function initArticles(){
  select.innerHTML=news.map(n=>'<option value="'+String(n.id).replace(/"/g,"&quot;")+'">'+String(n.title||"").replace(/</g,"&lt;")+'</option>').join("");
  showCurrent();
}
async function showCurrent(){
  const n=news.find(x=>x.id===select.value);if(!n)return;
  const r=await sb.from("article_images").select("image_url").eq("article_id",n.id).maybeSingle();
  const url=(r.data&&r.data.image_url)||n.image||"";
  current.innerHTML="<h3>"+String(n.title||"").replace(/</g,"&lt;")+"</h3>"+(url?'<img src="'+url.replace(/"/g,"&quot;")+'"><button type="button" id="copyUrlBtn" class="secondary">फोटो URL कॉपी करें</button><div id="photoUrl" class="status" style="word-break:break-all">'+url.replace(/</g,"&lt;").replace(/>/g,"&gt;")+"</div>":"<p>अभी कोई फोटो नहीं है।</p>"); if(url){const b=document.getElementById("copyUrlBtn");b.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(url);statusBox.textContent="फोटो URL कॉपी हो गया।";}catch(e){statusBox.textContent="URL कॉपी नहीं हुआ: "+(e.message||e);}});}
}
select.addEventListener("change",showCurrent);

loginBtn.addEventListener("click",async function(){
  loginStatus.textContent="Login हो रहा है...";
  loginBtn.disabled=true;
  try{
    const email=emailInput.value.trim();
    const password=passwordInput.value;
    if(!email||!password){loginStatus.textContent="Email और Password दोनों भरें।";return;}
    const r=await sb.auth.signInWithPassword({email:email,password:password});
    if(r.error){loginStatus.textContent="Login नहीं हुआ: "+r.error.message;return;}
    loginStatus.textContent="Login सफल।";
    await refreshSession();
  }catch(e){loginStatus.textContent="Login में समस्या: "+(e.message||e);}
  finally{loginBtn.disabled=false;}
});

document.getElementById("logoutBtn").addEventListener("click",async()=>{await sb.auth.signOut();refreshSession();});

document.getElementById("uploadBtn").addEventListener("click",async()=>{
  const file=fileInput.files[0],articleId=select.value;
  if(!file){statusBox.textContent="पहले फोटो चुनें।";return;}
  if(!file.type.startsWith("image/")){statusBox.textContent="केवल image file चुनें।";return;}
  const safe=file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,"-");
  statusBox.textContent="Upload हो रहा है...";
  try{
    const ur=await sb.auth.getUser();
    const uid=ur.data&&ur.data.user&&ur.data.user.id;
    if(!uid){statusBox.textContent="Login session समाप्त हो गया।";return;}
    const path=articleId+"/"+Date.now()+"-"+safe;
    const up=await sb.storage.from("news-images").upload(path,file,{upsert:false,contentType:file.type});
    if(up.error){statusBox.textContent="Upload error: "+up.error.message;return;}
    const pub=sb.storage.from("news-images").getPublicUrl(up.data.path);
    const db=await sb.from("article_images").upsert({article_id:articleId,image_url:pub.data.publicUrl,updated_by:uid,updated_at:new Date().toISOString()},{onConflict:"article_id"});
    if(db.error){statusBox.textContent="Database error: "+db.error.message;return;}
    statusBox.textContent="फोटो सफलतापूर्वक इसी खबर में लग गई।";
    fileInput.value="";showCurrent();
  }catch(e){statusBox.textContent="Upload में समस्या: "+(e.message||e);}
});
refreshSession();
</script>
</body>
</html>
